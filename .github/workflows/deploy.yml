name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          REMOTE_USER: ${{ secrets.USERNAME }}
          REMOTE_HOST: ${{ secrets.HOST }}
        run: |
          DEPLOY_PATH="/var/www/barsellelectrical.com/public"

          ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
            "sudo mkdir -p '$DEPLOY_PATH' && sudo chown -R '$REMOTE_USER':www-data '$DEPLOY_PATH'"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            out/ "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_PATH/"

          ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
            "sudo chown -R www-data:www-data '$DEPLOY_PATH' && sudo chmod -R 755 '$DEPLOY_PATH' && sudo systemctl reload nginx"
