name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Normalize line endings and ensure a trailing newline (avoids libcrypto errors)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          echo "SSH key OK"

      - name: Deploy to Server
        env:
          REMOTE_USER: ${{ secrets.USERNAME }}
          REMOTE_HOST: ${{ secrets.HOST }}
        run: |
          DEPLOY_PATH="/var/www/barsellelectrical.com/public"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"

          ssh $SSH_OPTS "$REMOTE_USER@$REMOTE_HOST" \
            "sudo mkdir -p '$DEPLOY_PATH' && sudo chown -R '$REMOTE_USER':www-data '$DEPLOY_PATH'"

          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            out/ "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_PATH/"

          ssh $SSH_OPTS "$REMOTE_USER@$REMOTE_HOST" \
            "sudo chown -R www-data:www-data '$DEPLOY_PATH' && sudo chmod -R 755 '$DEPLOY_PATH' && sudo systemctl reload nginx"
